<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marco Agent</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css"
  >

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js">
  </script>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js">
  </script>

  <script
    defer
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
  </script>

  <script
    defer
    src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js">
  </script>

  <style>
    :root {
      --bg: #0b0d12;
      --bg-soft: #11151d;
      --panel: #171c26;
      --panel-soft: #0f131b;
      --border: #293143;
      --text: #e8ebf3;
      --muted: #8b96aa;
      --muted-2: #667187;
      --accent: #6674f5;
      --accent-2: #8b5cf6;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    input[type="file"] {
      display: none;
    }

    .app {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

.model-picker {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 7px;
}

.model-picker select {
  width: 100%;
  min-width: 0;
  padding: 9px 10px;
  outline: none;
  color: var(--text);
  background: var(--panel-soft);
  border: 1px solid var(--border);
  border-radius: 8px;
}

.model-picker select:focus {
  border-color: var(--accent);
}

.model-picker select option {
  color: #111827;
  background: #fff;
}

.model-picker .model-load-btn {
  width: auto;
  min-width: 86px;
  padding: 9px 12px;
  white-space: nowrap;
}

@media (max-width: 380px) {
  .model-picker {
    grid-template-columns: 1fr;
  }

  .model-picker .model-load-btn {
    width: 100%;
  }
}

    .sidebar {
      width: 320px;
      flex: 0 0 320px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--bg-soft);
      border-right: 1px solid var(--border);
      transition: margin-left 0.2s ease;
    }

    body.sidebar-hidden .sidebar {
      margin-left: -320px;
    }

    .sidebar-head,
    .topbar {
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 15px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-logo,
    .welcome-logo {
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      font-weight: 800;
      background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent-2)
      );
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      border-radius: 8px;
    }

    .brand-logo img,
    .welcome-logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .brand-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    .icon-btn,
    .small-btn,
    .tool-btn {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
    }

    .icon-btn:hover,
    .small-btn:hover,
    .tool-btn:hover {
      color: var(--text);
      background: var(--panel);
      border-color: var(--border);
    }

    .tabs {
      display: flex;
      gap: 5px;
      padding: 10px 12px 5px;
    }

    .tab {
      flex: 1;
      padding: 8px;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-weight: 600;
    }

    .tab:hover,
    .tab.active {
      color: var(--text);
      background: var(--panel);
    }

    .panel {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    .panel.active {
      display: flex;
    }

    .history-search {
      padding: 9px 12px;
    }

    .history-search input,
    .field input,
    .field textarea {
      width: 100%;
      outline: none;
      color: var(--text);
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
    }

    .history-search input:focus,
    .field input:focus,
    .field textarea:focus {
      border-color: var(--accent);
    }

    .new-chat-btn,
    .primary-btn {
      margin: 2px 12px 9px;
      padding: 9px 12px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent-2)
      );
      font-weight: 650;
    }

    .new-chat-btn:hover,
    .primary-btn:hover {
      filter: brightness(1.08);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 2px 8px 14px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
    }

    .history-item:hover,
    .history-item.active {
      background: var(--panel);
    }

    .history-item.active {
      border-color: #3b4662;
    }

    .history-main {
      min-width: 0;
      flex: 1;
    }

    .history-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-meta {
      color: var(--muted-2);
      font-size: 11px;
    }

    .history-delete {
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 6px;
      color: var(--muted-2);
      background: transparent;
      opacity: 0;
    }

    .history-item:hover .history-delete {
      opacity: 1;
    }

    .history-delete:hover {
      color: #fff;
      background: rgba(239, 68, 68, 0.25);
    }

    .empty {
      padding: 28px 12px;
      color: var(--muted-2);
      text-align: center;
    }

    .settings-body {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .field textarea {
      resize: vertical;
      line-height: 1.5;
    }

    .field-tip {
      margin-top: 5px;
      color: var(--muted-2);
      font-size: 11px;
      line-height: 1.5;
    }

    .remember-key {
      display: flex !important;
      align-items: center;
      gap: 7px;
      margin-top: 7px;
      color: var(--muted) !important;
      font-size: 12px !important;
      font-weight: 400 !important;
    }

    .remember-key input {
      accent-color: var(--accent);
    }

    .mono {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;
    }

    .divider {
      height: 1px;
      margin: 17px 0;
      background: var(--border);
    }

    .secondary-btn {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: transparent;
    }

    .secondary-btn:hover {
      background: var(--panel);
    }

    .danger-btn {
      color: #fecaca;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .main {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: rgba(11, 13, 18, 0.9);
      backdrop-filter: blur(10px);
    }

    .top-title {
      min-width: 0;
      font-weight: 700;
    }

    .conversation-name {
      margin-left: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-left: auto;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      margin-right: 5px;
      border-radius: 50%;
      background: #3c4659;
    }

    .status-dot.ready {
      background: var(--success);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.65);
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px 18px 10px;
    }

    .chat-inner {
      max-width: 850px;
      margin: 0 auto;
    }

    .welcome {
      max-width: 650px;
      margin: 14vh auto 0;
      color: var(--muted);
      text-align: center;
    }

    .welcome-logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 16px;
      border-radius: 17px;
      font-size: 28px;
    }

    .welcome h1 {
      margin: 0 0 5px;
      color: var(--text);
      font-size: 24px;
    }

    .welcome p {
      margin: 0;
    }

    .message {
      display: flex;
      gap: 11px;
      margin-bottom: 20px;
      animation: fade-in 0.2s ease;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 31px;
      height: 31px;
      flex: 0 0 31px;
      display: grid;
      place-items: center;
      margin-top: 2px;
      overflow: hidden;
      border-radius: 8px;
      color: #fff;
      background: #2d374d;
      font-weight: 700;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .message.assistant .avatar {
      background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent-2)
      );
    }

    .bubble {
      min-width: 0;
      max-width: calc(100% - 45px);
      overflow-wrap: anywhere;
    }

    .message.user .bubble {
      padding: 10px 12px;
      border: 1px solid #303b54;
      border-radius: 11px 11px 4px 11px;
      background: #1d2638;
    }

    .message.assistant .bubble {
      padding: 1px 0;
    }

    .bubble p {
      margin: 0 0 9px;
    }

    .bubble p:last-child {
      margin-bottom: 0;
    }

    .bubble h1,
    .bubble h2,
    .bubble h3 {
      line-height: 1.35;
      margin: 15px 0 7px;
    }

    .bubble h1 {
      font-size: 20px;
    }

    .bubble h2 {
      font-size: 18px;
    }

    .bubble h3 {
      font-size: 16px;
    }

    .bubble ul,
    .bubble ol {
      margin: 7px 0 11px;
      padding-left: 22px;
    }

    .bubble li {
      margin: 3px 0;
    }

    .bubble code {
      padding: 2px 5px;
      border-radius: 4px;
      color: #cbd3ff;
      background: #1d2433;
      font: 13px ui-monospace, monospace;
    }

    .message-link {
      color: #aeb8ff;
      text-decoration: underline;
    }

    .math-source {
      overflow-x: auto;
      padding: 5px 0;
    }

    .katex {
      color: var(--text);
      font-size: 1.08em;
    }

    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 7px 0;
    }

    .code-block {
      margin: 11px 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d1017;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 10px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }

    .copy-code {
      padding: 3px 7px;
      border: 0;
      border-radius: 5px;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
    }

    .copy-code:hover {
      color: var(--text);
      background: #222a3a;
    }

    .code-block pre {
      margin: 0;
      padding: 11px 12px;
      overflow: auto;
    }

    .code-block pre code {
      padding: 0;
      color: #d9dff0;
      background: transparent;
      font: 12.5px/1.55 ui-monospace, monospace;
    }

    .message-images {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 8px;
    }

    .message-images img {
      width: auto;
      max-width: 220px;
      height: auto;
      max-height: 220px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: zoom-in;
      object-fit: cover;
    }

    .message-file {
      margin-bottom: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .message-file-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      cursor: pointer;
    }

    .message-file-header:hover {
      background: #171e2c;
    }

    .message-file-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .message-file-size {
      color: var(--muted-2);
      font-size: 11px;
    }

    .message-file-content {
      display: none;
      max-height: 260px;
      overflow: auto;
      padding: 9px 11px;
      border-top: 1px solid var(--border);
      color: #aab7d8;
      white-space: pre-wrap;
      word-break: break-word;
      font: 11px/1.55 ui-monospace, monospace;
    }

    .message-file.open .message-file-content {
      display: block;
    }

    .assistant-actions {
      display: flex;
      gap: 5px;
      margin-top: 8px;
    }

    .small-btn {
      width: 28px;
      height: 28px;
      flex-basis: 28px;
      border-color: var(--border);
      font-size: 13px;
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 15px;
      margin-left: 2px;
      vertical-align: -2px;
      background: var(--accent);
      animation: blink 1s steps(2, start) infinite;
    }

    .run-status {
      display: none;
      max-width: 850px;
      margin: 0 auto 8px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .run-status.show {
      display: block;
    }

    .run-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .run-label {
      flex: 1;
      color: #b7c1d6;
      font-size: 12px;
    }

    .run-time {
      color: var(--muted);
      font-size: 11px;
    }

    .progress {
      height: 4px;
      margin-top: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: #272f40;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(
        90deg,
        var(--accent),
        var(--accent-2)
      );
      transition: width 0.2s ease;
    }

    .composer-wrap {
      padding: 10px 18px 14px;
      background: linear-gradient(
        to top,
        var(--bg) 70%,
        transparent
      );
    }

    .composer-box {
      max-width: 850px;
      margin: 0 auto;
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
    }

    .attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 5px;
    }

    .attachments:empty {
      display: none;
    }

    .attachment {
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
      max-width: 250px;
      min-height: 52px;
      padding: 7px 28px 7px 9px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel-soft);
    }

    .attachment img {
      width: 48px;
      height: 48px;
      border-radius: 5px;
      object-fit: cover;
    }

    .attachment-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-meta {
      color: var(--muted-2);
      font-size: 10px;
    }

    .remove-attachment {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: #293244;
      font-size: 11px;
    }

    .remove-attachment:hover {
      background: var(--danger);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      padding: 0 3px 2px 7px;
    }

    .composer textarea {
      flex: 1;
      min-height: 23px;
      max-height: 180px;
      padding: 8px 0;
      resize: none;
      outline: 0;
      border: 0;
      color: var(--text);
      background: transparent;
      line-height: 1.55;
    }

    .composer textarea::placeholder {
      color: #626d83;
    }

    .composer-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .send-btn {
      height: 34px;
      padding: 0 14px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent-2)
      );
      font-weight: 650;
    }

    .send-btn.stop {
      background: linear-gradient(
        135deg,
        #ef4444,
        #f97316
      );
    }

    .hint {
      max-width: 850px;
      margin: 6px auto 0;
      color: #606c82;
      text-align: center;
      font-size: 10.5px;
    }

    .error-box {
      margin: 0 0 16px;
      padding: 10px 12px;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 8px;
      color: #fecaca;
      background: rgba(239, 68, 68, 0.08);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .drop-overlay {
      position: fixed;
      z-index: 90;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(11, 13, 18, 0.86);
    }

    .drop-overlay.show {
      display: grid;
    }

    .drop-inner {
      padding: 45px 65px;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      text-align: center;
    }

    .drop-inner strong {
      display: block;
      font-size: 18px;
    }

    .drop-inner span {
      color: var(--muted);
      font-size: 12px;
    }

    .lightbox {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 25px;
      background: rgba(0, 0, 0, 0.9);
      cursor: zoom-out;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
    }

    .toast {
      position: fixed;
      z-index: 200;
      bottom: 25px;
      left: 50%;
      max-width: 85vw;
      padding: 9px 15px;
      transform: translateX(-50%);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: #202738;
      box-shadow: 0 10px 30px #0008;
    }

    .toast.error {
      color: #fecaca;
      border-color: #7f3030;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes blink {
      to {
        visibility: hidden;
      }
    }

    @media (max-width: 900px) {
      .sidebar {
        position: fixed;
        z-index: 50;
        top: 0;
        bottom: 0;
        left: 0;
        width: 320px;
        margin-left: -100%;
        box-shadow: 20px 0 50px #0009;
      }

      .sidebar.open {
        margin-left: 0;
      }

      body.sidebar-hidden .sidebar {
        margin-left: -100%;
      }

      .chat {
        padding: 18px 13px 7px;
      }

      .composer-wrap {
        padding: 9px 11px 13px;
      }

      .conversation-name {
        display: none;
      }

      .message-images img {
        max-width: 160px;
        max-height: 160px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <div class="brand-logo" id="brandLogo">M</div>
          <div class="brand-name">Marco Agent</div>
        </div>

        <button
          class="icon-btn"
          id="closeSidebar"
          title="关闭侧栏">
          ×
        </button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="history">
          对话
        </button>

        <button class="tab" data-tab="settings">
          设置
        </button>
      </div>

      <section class="panel active" id="panel-history">
        <div class="history-search">
          <input
            id="historySearch"
            placeholder="搜索历史对话">
        </div>

        <button
          class="new-chat-btn"
          id="newConversationButton">
          ＋ 新建对话
        </button>

        <div
          class="history-list"
          id="historyList">
        </div>
      </section>

      <section class="panel" id="panel-settings">
        <div class="settings-body">
          <div class="field">
            <label for="apiBase">API 地址</label>

            <input
              id="apiBase"
              class="mono"
              placeholder="https://api.openai.com/v1">
          </div>

          <div class="field">
            <label for="apiKey">API Key</label>

            <input
              id="apiKey"
              class="mono"
              type="password"
              autocomplete="off"
              placeholder="请输入 API Key">

            <label class="remember-key">
              <input
                type="checkbox"
                id="rememberApiKey"
                checked>
              记住 API Key
            </label>

            <div class="field-tip">
              勾选后会保存到浏览器 localStorage。
            </div>
          </div>

          <div class="field">
  <label for="model">模型名称</label>

  <div class="model-picker">
    <select
      id="model"
      class="mono"
      aria-label="选择模型">
      <option value="">请先获取模型</option>
    </select>

    <button
      class="secondary-btn model-load-btn"
      id="loadModelsButton"
      type="button">
      获取模型
    </button>
  </div>

  <div
    class="field-tip"
    id="modelResult">
    输入 API 地址和 API Key 后获取模型。
  </div>
</div>


  

          <div class="field">
            <label for="temperature">温度</label>

            <input
              id="temperature"
              type="number"
              min="0"
              max="2"
              step="0.1"
              value="0.7">
          </div>

          <div class="field">
            <label for="systemPrompt">系统提示词</label>

            <textarea
              id="systemPrompt"
              rows="6"
              placeholder="你是一个有帮助的 AI 助手。"></textarea>
          </div>

          <button
            class="primary-btn"
            id="saveSettingsButton">
            保存设置
          </button>

          <div style="height: 8px"></div>

          <button
            class="secondary-btn"
            id="testConnectionButton">
            测试连接
          </button>

          <div
            class="field-tip"
            id="testResult">
          </div>

          <div class="divider"></div>

          <button
            class="secondary-btn danger-btn"
            id="clearAllButton">
            清空全部历史对话
          </button>
        </div>
      </section>
    </aside>

    <main class="main">
      <header class="topbar">
        <button
          class="icon-btn"
          id="menuButton"
          title="打开菜单">
          ☰
        </button>

        <div class="top-title">
          Marco Agent
          <span
            class="conversation-name"
            id="conversationName">
          </span>
        </div>

        <div class="top-actions">
          <span
            class="status-dot"
            id="statusDot">
          </span>

          <button
            class="icon-btn"
            id="topNewConversationButton"
            title="新建对话">
            ＋
          </button>

          <button
            class="icon-btn"
            id="clearCurrentButton"
            title="清空当前对话">
            🗑
          </button>
        </div>
      </header>

      <section class="chat" id="chat">
        <div
          class="chat-inner"
          id="chatInner">
        </div>
      </section>

      <section class="composer-wrap">
        <div
          class="run-status"
          id="runStatus">
          <div class="run-line">
            <span
              class="run-label"
              id="runLabel">
              准备中
            </span>

            <span
              class="run-time"
              id="runTime">
            </span>
          </div>

          <div class="progress">
            <div
              class="progress-bar"
              id="progressBar">
            </div>
          </div>
        </div>

        <div class="composer-box">
          <div
            class="attachments"
            id="attachments">
          </div>

          <div class="composer">
            <textarea
              id="messageInput"
              rows="1"
              placeholder="输入任务，或上传图片、PDF、Word 和文本文件"></textarea>

            <div class="composer-actions">
              <button
                class="tool-btn"
                id="imageButton"
                title="上传图片">
                🖼
              </button>

              <button
                class="tool-btn"
                id="fileButton"
                title="上传文件">
                📎
              </button>

              <button
                class="send-btn"
                id="sendButton"
                disabled>
                发送
              </button>
            </div>
          </div>
        </div>

        <div class="hint">
          Enter 发送，Shift + Enter 换行 · 支持公式渲染 · 回答可导出 LaTeX
        </div>
      </section>
    </main>
  </div>

  <input
    type="file"
    id="imageInput"
    accept="image/png,image/jpeg,image/webp,image/gif"
    multiple>

  <input
    type="file"
    id="fileInput"
    accept=".txt,.md,.markdown,.json,.csv,.html,.htm,.css,.js,.mjs,.ts,.tsx,.jsx,.py,.java,.c,.cpp,.h,.hpp,.go,.rs,.php,.sql,.yaml,.yml,.xml,.log,.pdf,.docx"
    multiple>

  <div
    class="drop-overlay"
    id="dropOverlay">
    <div class="drop-inner">
      <strong>松开即可上传</strong>
      <span>支持图片、PDF、DOCX 和文本文件</span>
    </div>
  </div>

  <script defer src="./app.js"></script>
</body>
</html>
